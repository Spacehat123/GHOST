<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>L’inchiostro che scopre</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/mona-sans@5.3.0/standard.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add('js');</script>
</head>
<body>
  <main class="palco" data-palco>
    <h1 class="parola" data-parola>Soffio</h1>
    <!-- sopra la carta: la tela WebGL disegna il gemello gonfio solo dove passa l'inchiostro -->
    <canvas class="tela" data-tela aria-hidden="true"></canvas>
    <!-- senza WebGL il gemello è in CSS e lo scopre un cerchio che segue il puntatore -->
    <div class="gemello" data-gemello aria-hidden="true"><span>Soffio</span></div>
    <p class="nota">Passa sopra la carta: sotto c’è la stessa parola, gonfia.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
