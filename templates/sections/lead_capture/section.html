<!-- LEAD CAPTURE (THE LEADS INBOX) -->
<section id="contact" class="py-24 px-6 md:px-16 relative" style="border-top: 1px solid var(--border-color);">
  <div class="max-w-2xl mx-auto glass-panel p-8 md:p-12 rounded-3xl">
    <div class="text-center mb-8">
      <p class="text-xs uppercase tracking-[0.25em] font-mono mb-2" style="color: var(--accent-color);">Send an Inquiry</p>
      <h2 class="text-3xl md:text-4xl font-bold tracking-tight" style="font-family: {{ arch.font_head }};">Tell {{ main_title }} what you need</h2>
      <p class="text-xs md:text-sm mt-3 leading-relaxed" style="color: var(--muted-color);">No forms lost in spam — your message goes straight to the team.</p>
    </div>
    <form data-lead-inbox="{{ form_path }}" class="space-y-4 text-left">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-[10px] uppercase font-mono tracking-wider mb-1.5" for="lead-name" style="color: var(--muted-color);">Your Name</label>
          <input id="lead-name" name="name" type="text" required placeholder="e.g. Priya" class="w-full text-xs rounded-xl p-3 border outline-none font-sans" style="background: var(--bg-color); border-color: var(--border-color); color: var(--text-color);" />
        </div>
        <div>
          <label class="block text-[10px] uppercase font-mono tracking-wider mb-1.5" for="lead-contact" style="color: var(--muted-color);">Phone or Email</label>
          <input id="lead-contact" name="contact" type="text" required placeholder="How should we reach you?" class="w-full text-xs rounded-xl p-3 border outline-none font-sans" style="background: var(--bg-color); border-color: var(--border-color); color: var(--text-color);" />
        </div>
      </div>
      <div>
        <label class="block text-[10px] uppercase font-mono tracking-wider mb-1.5" for="lead-message" style="color: var(--muted-color);">Message</label>
        <textarea id="lead-message" name="message" rows="4" required placeholder="What do you need?" class="w-full text-xs rounded-xl p-3 border outline-none font-sans" style="background: var(--bg-color); border-color: var(--border-color); color: var(--text-color);"></textarea>
      </div>
      <!-- honeypot: humans never see this field; bots fill it and get swallowed -->
      <input name="company_website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true" class="absolute opacity-0 pointer-events-none" style="left:-9999px;" />
      <button type="submit" class="w-full px-8 py-3.5 rounded-full text-xs uppercase tracking-widest font-semibold transition-transform active:scale-95 shadow-lg"
              style="background: var(--accent-color); color: var(--on-accent);">
        Send Inquiry
      </button>
      <p class="lead-status text-center text-[11px] font-mono min-h-[1.2em]" style="color: var(--muted-color);" role="status" aria-live="polite"></p>
    </form>
  </div>
</section>
