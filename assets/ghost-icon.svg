<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262626" />
      <stop offset="50%" stop-color="#171717" />
      <stop offset="100%" stop-color="#0a0a0a" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="skullBone" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f4" />
      <stop offset="100%" stop-color="#d6d3d1" />
    </linearGradient>
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  
  <!-- Outer Tactical Shield / Emblem -->
  <path d="M 256,40 L 416,104 C 416,272 344,384 256,448 C 168,384 96,272 96,104 Z" 
        fill="url(#shieldGrad)" stroke="url(#goldAccent)" stroke-width="6" stroke-linejoin="round" filter="url(#outerGlow)" />

  <!-- Tactical Hex Grid Pattern / Inner Shield -->
  <path d="M 256,60 L 396,116 C 396,260 334,360 256,420 C 178,360 116,260 116,116 Z" 
        fill="none" stroke="#333333" stroke-width="2" stroke-dasharray="8 6" opacity="0.6" />

  <!-- Ghost Balaclava Silhouette -->
  <path d="M 180,140 C 180,95 332,95 332,140 C 332,175 352,240 336,330 C 324,395 290,410 256,410 C 222,410 188,395 176,330 C 160,240 180,175 180,140 Z" 
        fill="#141414" stroke="#2b2b2b" stroke-width="3" />

  <!-- Iconic Task Force 141 Ghost Skull Faceplate -->
  <!-- Skull Forehead & Cranium -->
  <path d="M 196,160 C 196,130 316,130 316,160 C 324,195 320,230 312,250 C 304,260 292,260 286,252 C 278,242 274,242 268,252 C 262,260 250,260 244,252 C 238,242 234,242 226,252 C 220,260 208,260 200,250 C 192,230 188,195 196,160 Z" 
        fill="url(#skullBone)" stroke="#0f0f0f" stroke-width="2" />

  <!-- Eye Sockets (Fierce Tactical Angles) -->
  <path d="M 210,180 L 242,196 L 234,222 L 204,204 Z" fill="#0a0a0a" stroke="#1c1917" stroke-width="2" />
  <path d="M 302,180 L 270,196 L 278,222 L 308,204 Z" fill="#0a0a0a" stroke="#1c1917" stroke-width="2" />
  
  <!-- Glowing Amber Reticle Eye Accents -->
  <circle cx="225" cy="200" r="3" fill="#f59e0b" />
  <circle cx="287" cy="200" r="3" fill="#f59e0b" />

  <!-- Nasal Cavity -->
  <path d="M 256,218 L 248,242 L 256,238 L 264,242 Z" fill="#0a0a0a" />

  <!-- Skull Vertical Teeth / Jaw Plate (Stitched Fabric Look) -->
  <g fill="url(#skullBone)" stroke="#0a0a0a" stroke-width="2.5">
    <!-- Center Teeth -->
    <rect x="250" y="260" width="12" height="42" rx="3" />
    <rect x="232" y="262" width="11" height="38" rx="3" />
    <rect x="269" y="262" width="11" height="38" rx="3" />
    <rect x="215" y="266" width="10" height="32" rx="3" />
    <rect x="287" y="266" width="10" height="32" rx="3" />
    <rect x="199" y="272" width="9" height="24" rx="2" />
    <rect x="304" y="272" width="9" height="24" rx="2" />
  </g>

  <!-- Task Force 141 Banner Ribbon / Label -->
  <path d="M 180,380 L 256,366 L 332,380 L 322,404 L 256,394 L 190,404 Z" 
        fill="#0a0a0a" stroke="url(#goldAccent)" stroke-width="2" />
  <text x="256" y="390" text-anchor="middle" font-family="'Courier New', monospace" font-size="13" font-weight="900" fill="#f59e0b" letter-spacing="4">
    TASK FORCE 141
  </text>
  
  <!-- Sub-header HUD Callout -->
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#a8a29e" letter-spacing="6">
    GHOST AI
  </text>
</svg>
