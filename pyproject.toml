[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost"
version = "0.1.0"
description = "Ghost: Full-Duplex Voice & Ambient Desktop HUD Assistant inspired by Huw Prosser's Rose / Jarvis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fury-sdk>=0.3.2",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "websockets>=12.0",
    "aiohttp>=3.9.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
ghost = "ghost.main:main"
